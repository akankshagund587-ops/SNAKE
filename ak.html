
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Runner</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#102a18;color:white;
 font-family:Arial;text-align:center;
}
h2{color:gold;margin:10px}
#score{font-size:20px;margin:8px}
canvas{
 width:min(100%,420px);
 height:auto;
 background:#326c32;
 display:block;margin:auto;
}
button{
 background:orange;border:0;border-radius:12px;
 padding:13px 22px;margin:5px;
 font-size:18px;font-weight:bold;
}
#start{
 position:fixed;inset:0;background:#000b;
 display:flex;justify-content:center;
 align-items:center;flex-direction:column;
 z-index:5;
}
#start button{font-size:25px}
</style>
</head>
<body>
<h2>🏃 JUNGLE RUN</h2>
<div id="score">Score: 0 | Coins: 0</div>
<canvas id="game" width="420" height="600"></canvas>

<div>
<button onclick="move(-1)">⬅️</button>
<button onclick="jump()">⬆️ JUMP</button>
<button onclick="move(1)">➡️</button>
</div>

<div id="start">
<h1>🌴 JUNGLE RUN 🌴</h1>
<button onclick="startGame()">▶ START GAME</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player=1, obstacles=[], coins=[];
let score=0,total=0,speed=5;
let running=false,over=false;
let jumpTime=0,frame=0;

const lanes=[105,210,315];

function startGame(){
 player=1;obstacles=[];coins=[];
 score=0;total=0;speed=5;
 jumpTime=0;frame=0;over=false;
 running=true;
 document.getElementById("start").style.display="none";
 requestAnimationFrame(loop);
}

function move(d){
 if(!running)return;
 player=Math.max(0,Math.min(2,player+d));
}

function jump(){
 if(running && jumpTime<=0)jumpTime=30;
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
 if(e.key==="ArrowUp"||e.key===" ")jump();
});

function spawn(){
 let lane=Math.floor(Math.random()*3);
 obstacles.push({lane,y:-40});
 if(Math.random()<0.8)
 coins.push({lane:Math.floor(Math.random()*3),y:-150});
}

function drawRoad(){
 ctx.fillStyle="#24632c";
 ctx.fillRect(0,0,420,600);

 ctx.fillStyle="#555";
 ctx.beginPath();
 ctx.moveTo(65,0);
 ctx.lineTo(355,0);
 ctx.lineTo(420,600);
 ctx.lineTo(0,600);
 ctx.fill();

 ctx.strokeStyle="white";
 ctx.lineWidth=3;
 ctx.setLineDash([25,25]);
 ctx.beginPath();
 ctx.moveTo(165,0);ctx.lineTo(140,600);
 ctx.moveTo(255,0);ctx.lineTo(280,600);
 ctx.stroke();
 ctx.setLineDash([]);
}

function loop(){
 if(!running)return;
 frame++;

 if(frame%65===0)spawn();
 if(frame%500===0)speed+=0.5;

 drawRoad();

 // Coins
 coins.forEach(o=>{
  o.y+=speed;
  ctx.font="30px Arial";
  ctx.fillText("🪙",lanes[o.lane]-15,o.y);

  if(o.lane===player&&o.y>455&&o.y<525){
   o.y=700;
   total++;
  }
 });

 // Obstacles
 obstacles.forEach(o=>{
  o.y+=speed;
  ctx.font="38px Arial";
  ctx.fillText("🪨",lanes[o.lane]-18,o.y);

  if(o.lane===player&&o.y>445&&o.y<520&&jumpTime<10){
   gameOver();
  }
 });

 coins=coins.filter(o=>o.y<650);
 obstacles=obstacles.filter(o=>o.y<650);

 if(jumpTime>0)jumpTime--;

 // Player
 ctx.font="48px Arial";
 ctx.fillText("🏃",lanes[player]-23,
  510-Math.sin((30-jumpTime)/30*Math.PI)*100
 );

 score++;
 document.getElementById("score").innerText=
 "Score: "+score+" | Coins: "+total;

 if(running)requestAnimationFrame(loop);
}

function gameOver(){
 running=false;
 over=true;
 document.getElementById("start").style.display="flex";
 document.querySelector("#start h1").innerText="GAME OVER!";
 document.querySelector("#start button").innerText="🔄 PLAY AGAIN";
}
</script>
</body>
</html>
